[project]
name = "kasm-workspaces-mcp"
version = "0.1.0"
description = "MCP server for managing Kasm Workspaces sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "aiohttp>=3.9.0,<3.14",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ssh = ["asyncssh>=2.14.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aioresponses>=0.7.6",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
kasm-mcp = "kasm_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kasm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
packages = ["kasm_mcp"]
